name: Build gallery manifest

on:
  push:
    paths:
      - 'gallery/**'
      - '.github/workflows/build-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate gallery/manifest.json
        run: |
          python3 - << 'PY'
          import os, json, subprocess

          GALLERY = "gallery"
          EXTS = {".jpg", ".jpeg", ".png", ".webp", ".gif", ".avif"}

          files = [
              f for f in os.listdir(GALLERY)
              if os.path.splitext(f)[1].lower() in EXTS
          ]

          def added_time(fname):
              try:
                  out = subprocess.check_output(
                      ["git", "log", "-1", "--format=%ct", "--", f"{GALLERY}/{fname}"]
                  ).decode().strip()
                  return int(out) if out else 0
              except Exception:
                  return 0

          files.sort(key=lambda f: (added_time(f), f.lower()), reverse=True)

          with open(f"{GALLERY}/manifest.json", "w", encoding="utf-8") as fh:
              json.dump(files, fh, ensure_ascii=False, indent=0)

          print(f"Wrote {len(files)} image(s):")
          print("\n".join(files))
          PY

      - name: Commit manifest if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gallery/manifest.json
          git diff --staged --quiet || git commit -m "auto: update gallery manifest"
          git push
